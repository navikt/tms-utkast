version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github:
        patterns:
          - "*"
    cooldown:
      default-days: 3

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
    groups:
      central-admin:
        patterns:
          - "no.nav.tms:*"


  - package-ecosystem: "gradle"
    directory: "/gradle"
    schedule:
      interval: "weekly"
    internal:
      patterns:
        - "org.jetbrains.kotlin:*"
        - "de.huxhorn.sulky:*"
      update-types:
        - "minor"
        - "patch"
    gradle-major:
      patterns:
        - "*"
      update-types:
        - "major"
    labels:
      - gradle
      - dependencies