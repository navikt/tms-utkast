version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "github-actions"
    directories: "/"
    schedule: weekly
    groups:
      github:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Berlin"
    groups:
      gradle-major:
        patterns:
          - "*"
        update-types:
          - "major"
      internal:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "de.huxhorn.sulky:*"
        update-types:
          - "minor"
          - "patch"
      central-admin:
        patterns:
          - "no.nav.tms:*"

    labels:
      - gradle
      - dependencies