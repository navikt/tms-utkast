name: Update Gradle Wrapper

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-gradle-wrapper.yaml
  schedule:
    - cron: "0 10 1 1/3 *"

jobs:
  update-gradle-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # ratchet:actions/checkout@v5

      - name: Sett opp java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # ratchet:actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Update Gradle Wrapper
        uses: gradle-update/update-gradle-wrapper-action@512b1875f3b6270828abfe77b247d5895a2da1e5 # ratchet:gradle-update/update-gradle-wrapper-action@v2
